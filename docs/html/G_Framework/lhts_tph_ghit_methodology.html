<!-- ===== THREE-LAYER SUBSTITUTION ===== -->
<g transform="translate(30, 296)">
  <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">三层替代结构（L-测度文档核心结论）</text>

  <!-- Layer 1: Expression -->
  <g filter="url(#sh)">
  <rect x="0" y="12" width="430" height="155" rx="8" fill="url(#gExpr)"/>
  </g>
  <text x="215" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0d0f0">第一层 · 表达替代</text>
  <text x="215" y="56" text-anchor="middle" font-size="11" fill="#d0e8f0">PDE 局部微分表达 ⇒ L-积分/测度表达</text>
  <g font-size="9.5">
    <text x="16" y="78" fill="#c0d8f0">设 D_Lu 是 u 的 L-变化测度，∂_Lu = dD_Lu/dμ_L</text>
    <text x="16" y="94" fill="#c0d8f0">→ 偏微分 = L-测度变化的局部密度</text>
    <text x="16" y="114" fill="#a0c0e0" font-weight="bold">关键：不是 L₀ 裸差分对 PDE 的粗糙替代</text>
    <text x="16" y="130" fill="#a0c0e0">而是把 PDE 局部偏微分表达提升为 Law-Space 中的</text>
    <text x="16" y="144" fill="#a0c0e0">L-积分/测度弱表达（保留全部语义信息）</text>
    <text x="16" y="160" fill="#80a0c0" font-size="8.5" font-style="italic">P[u]=0, B[u]=0 → E(u)=½‖P[u]‖²+λ/2‖B[u]‖²</text>
  </g>
  <line x1="215" y1="167" x2="215" y2="183" stroke="#666" stroke-width="1.8" marker-end="url(#aD)"/>

  <!-- Layer 2: Solving -->
  <g filter="url(#sh)">

  <text x="215" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffe0a0">第二层 · 求解替代</text>
  <text x="215" y="227" text-anchor="middle" font-size="11" fill="#f0e0c0">PDE 函数求解 ⇒ L-路径测度低作用量命中</text>
  <g font-size="9.5">
    <text x="16" y="249" fill="#e8d8b0">求解对象从函数空间 → 路径空间</text>
    <text x="16" y="265" fill="#e8d8b0">寻找使残差下降+JacGap下降+风险受控+目标兑现</text>
    <text x="16" y="279" fill="#e8d8b0">的有效变分路径（而非逐点解析延拓）</text>
    <text x="16" y="299" fill="#f0d890" font-weight="bold">命中泛函：J_{T,L}(Γ) = Prob(τ^Γ_{ε,L} ≤ T)</text>

    <text x="651" y="128" text-anchor="middle" font-size="9.5" fill="#c0f0d8">轨迹函数参数同伦选择与确定性收敛控制层</text>
    <g font-size="9">
